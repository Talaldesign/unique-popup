
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Popup — Dashboard & Analytics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MAIN POPUP CARD -->
<div id="popupCard" class="popup-card hidden" role="dialog" aria-live="polite">
  <div class="logo-row">
    <img id="logo" src="logo.png" alt="Logo">
  </div>
  <div id="messageArea" class="message-area"><span id="typewriter"></span><span class="cursor">|</span></div>
  <div id="socialIcons" class="social-icons"></div>
  <div class="actions">
    <button id="closeBtn" class="btn">أغلق</button>
  </div>
</div>

<!-- Admin Icon -->
<button id="adminIcon" class="admin-icon" title="لوحة التحكم">⚙️</button>

<!-- Admin Modal / Dashboard -->
<div id="adminModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <header>
      <h2>لوحة التحكم — Analytics & Settings</h2>
      <button id="closeAdmin" class="close-x">✕</button>
    </header>

    <section class="tabs">
      <button class="tab-btn active" data-tab="manage">الإدارة</button>
      <button class="tab-btn" data-tab="analytics">التحليلات</button>
      <button class="tab-btn" data-tab="settings">الإعدادات</button>
    </section>

    <section id="manage" class="tab-page">
      <h3>العبارات</h3>
      <input id="phraseInput" placeholder="أدخل عبارة جديدة">
      <button id="addPhrase">إضافة</button>
      <ul id="phrasesList" class="list"></ul>

      <h3>التواصل الاجتماعي</h3>
      <input id="socialName" placeholder="اسم المنصة">
      <input id="socialURL" placeholder="الرابط">
      <input type="file" id="socialIconFile" accept="image/*">
      <button id="addSocial">إضافة</button>
      <ul id="socialList" class="list"></ul>
    </section>

    <section id="analytics" class="tab-page hidden">
      <h3>إحصائيات الوقت الحقيقي</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">زيارات الصفحة</div>
          <div id="statVisits" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">زوار فريدون</div>
          <div id="statUniques" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">مظاهر Popup</div>
          <div id="statShown" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">نقرات التواصل</div>
          <div id="statClicks" class="stat-value">0</div>
        </div>
      </div>

      <h4>نشاط الوقت الحقيقي (آخر أحداث)</h4>
      <ul id="liveEvents" class="live-list"></ul>

      <div class="analytics-actions">
        <button id="exportBtn" class="btn">تصدير البيانات (JSON)</button>
        <button id="resetBtn" class="btn warn">إعادة ضبط الإحصائيات</button>
      </div>
    </section>

    <section id="settings" class="tab-page hidden">
      <h3>الإعدادات العامة</h3>
      <label>كلمة مرور المشرف</label>
      <input id="adminPass" type="password" placeholder="أدخل كلمة مرور جديدة">
      <button id="savePass" class="btn">حفظ</button>

      <h3>ثيم</h3>
      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="glass">Glass</option>
        <option value="neon">Neon</option>
        <option value="gradient">Gradient</option>
      </select>
      <button id="applyTheme" class="btn">تطبيق الثيم</button>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
