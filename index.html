<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unique Popup — الصفحة الرئيسية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="siteHeader">
    <img id="siteLogo" src="assets/logo.png" alt="Logo" />
  </header>

  <main id="mainArea">
    <div id="popupCard" class="popup-card hidden" role="dialog" aria-live="polite">
      <div id="messageArea"><span id="typewriter"></span><span class="cursor">|</span></div>
    </div>

    <div id="socialIcons" class="social-icons" aria-label="روابط التواصل الاجتماعي"></div>
  </main>

  <button id="adminBtn" class="admin-btn" title="لوحة التحكم">⚙️</button>

  <!-- تحميل السكربت بصيغة Module -->
  <script type="module" src="script.js"></script>
</body>
</html>
