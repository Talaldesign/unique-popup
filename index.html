<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>عبارة المستخدم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  text-align: center;
  font-family: sans-serif;
  padding-top: 50px;
}
#msg {
  font-size: 28px;
  font-weight: bold;
}


  #admin-icon {
  position: fixed;
  top: 15px;
  right: 15px;
  cursor: pointer;
  font-size: 24px;
  background: #ffffffcc;
  padding: 6px 10px;
  border-radius: 8px;
  backdrop-filter: blur(4px);
  border: 1px solid #ddd;
  transition: 0.2s;
  z-index: 9999;
}
#admin-icon:hover {
  transform: scale(1.2);
}

  
</style>
</head>
<body>

<h2>رسالة المستخدم:</h2>
<div id="msg">جاري التحميل...</div>
<div id="admin-icon" onclick="openAdmin()">⚙️</div>

<script src="script.js"></script>
<script src="supabase-config.js"></script>

</body>
</html>
